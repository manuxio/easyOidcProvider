# nginx in front of the auth-server: TLS termination, and nothing else.
#
# Mounted at /etc/nginx/conf.d/default.conf. The certificate and key come from
# /etc/nginx/tls, which is a mount too (deploy/tls/, gitignored, produced by
# deploy/make-lab-cert.sh).
#
# The three settings that matter for Kerberos are the buffer sizes and the
# Authorization header. A domain user who belongs to many groups carries a
# Kerberos ticket of 8-16 KB, and the SPNEGO token is that ticket, base64, in a
# single `Authorization: Negotiate ...` request header. nginx's defaults (a 8k
# large-header buffer, a 4k/8k proxy buffer) turn that into a 400 on the client
# side and a puzzled silence in the application log.

# A Kerberos ticket for a user with many group memberships is 8-16 KB, and it
# travels base64-encoded inside one `Authorization: Negotiate ...` request
# header. nginx's default (4 buffers of 8k) turns that into a bare 400 with no
# explanation, before any server block is chosen.
#
# It sits HERE, at http level, and not inside the server block on purpose:
# nginx has to read the request headers before it can know which virtual server
# they belong to, so the value that applies while they are being read is the
# default server's. With a single server on this port the two are the same
# thing today — but the day a second server_name is added to this file, the
# setting nested in the wrong block would silently stop applying.
# This file is included from inside http{} (/etc/nginx/conf.d/*.conf).
large_client_header_buffers 4 32k;

upstream auth_server {
    # Resolved once at startup from Docker's embedded DNS; the app container has
    # a fixed address on the internal network, so there is nothing to re-resolve.
    server auth-server:3000;
    keepalive 16;
}

# Plain HTTP exists only to send the client to HTTPS. The issuer is an https
# URL, so anything that arrives here is a client that has not read the discovery
# document yet.
server {
    listen 80;
    listen [::]:80;
    server_name auth.lab.easyoidc.local;

    # 301 and not 302: the redirect is a property of the deployment, not of the
    # moment, and clients may cache it.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.lab.easyoidc.local;

    ssl_certificate     /etc/nginx/tls/auth.crt;
    ssl_certificate_key /etc/nginx/tls/auth.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:4m;
    ssl_session_timeout 1h;

    # The response side of the same problem: what the application sends back
    # back can carry a `WWW-Authenticate: Negotiate <token>` of comparable size
    # when the client asked for mutual authentication.
    proxy_buffer_size   16k;
    proxy_buffers       8 16k;
    proxy_busy_buffers_size 32k;

    access_log /var/log/nginx/auth-access.log;
    error_log  /var/log/nginx/auth-error.log warn;

    location / {
        proxy_pass http://auth_server;
        proxy_http_version 1.1;

        # SPNEGO is a request-scoped exchange in this deployment (one leg), so
        # connection reuse is safe; the application keeps no GSSAPI context
        # between two HTTP requests.
        proxy_set_header Connection "";

        # The Host the client used is the name inside the Kerberos SPN and the
        # name in ISSUER_URL. Passing it through keeps the two aligned.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # TRUST_PROXY=true makes the application read these: they are what turns
        # its session cookies `Secure` behind a proxy that terminated the TLS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # nginx forwards Authorization by default. It is spelled out because
        # this is the header the whole design hangs on: one `proxy_set_header`
        # added carelessly in this block would silently drop every header that
        # is not re-declared, and the symptom — SSO stops, the fallback form
        # appears — looks nothing like the cause.
        proxy_set_header Authorization     $http_authorization;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
