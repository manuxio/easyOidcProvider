# Kerberos client configuration for the auth-server laboratory realm.
#
# Mounted read-only at /etc/krb5.conf inside the krb-client container, and the
# file the auth-server container will mount once phase 3 needs SPNEGO.
# The KDC is the lab Samba AD DC (dc1.lab.easyoidc.local, 172.28.10.10),
# which is also the DNS server of the lab network.

[libdefaults]
    default_realm = LAB.EASYOIDC.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = true
    # The lab has no PTR records: never canonicalise a host through reverse DNS,
    # or the SPN the client asks for stops matching the one in the keytab.
    rdns = false
    forwardable = true
    ticket_lifetime = 10h
    renew_lifetime = 7d
    default_ccache_name = FILE:/tmp/krb5cc_%{uid}

[realms]
    LAB.EASYOIDC.LOCAL = {
        kdc = dc1.lab.easyoidc.local
        admin_server = dc1.lab.easyoidc.local
        kpasswd_server = dc1.lab.easyoidc.local
        default_domain = lab.easyoidc.local
    }

[domain_realm]
    .lab.easyoidc.local = LAB.EASYOIDC.LOCAL
    lab.easyoidc.local = LAB.EASYOIDC.LOCAL
